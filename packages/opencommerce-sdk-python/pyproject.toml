[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencommerce-sdk"
version = "1.0.0"
description = "Python SDK for the OpenCommerce Platform MCP Gateway — lets AI Agents (and any Python code) discover and execute platform capabilities."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "OpenCommerce Platform" }]
keywords = ["opencommerce", "mcp", "model-context-protocol", "ai-agents", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.8"]

[project.urls]
Homepage = "https://opencommerce.ir"

[tool.setuptools.packages.find]
include = ["opencommerce_sdk*"]
